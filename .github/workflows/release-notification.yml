name: Release Notification to Slack

# Posts the release's CHANGELOG section to Slack when a release PR is merged
# into master, via the shared slack-post workflow
# (https://github.com/novaramedia/nm-shared-workflows).
#
# Reports the merge, not a deploy: production is still updated by hand. Once
# production deploys from CI, this should fire after a successful deploy
# instead; see docs/plans/production-ci-deploy.md.
#
# Needs: SLACK_BOT_TOKEN secret, SLACK_RELEASE_CHANNEL repo variable, and the
# bot as a member of that channel.

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: read

jobs:
  version:
    # Release PRs are titled "Release: x.y.z" by scripts/release.sh — the single
    # canonical prefix. Keep the two in sync if either changes.
    if: "github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release: ')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read version from package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  notify:
    needs: version
    uses: novaramedia/nm-shared-workflows/.github/workflows/slack-post.yml@v1
    with:
      channel: ${{ vars.SLACK_RELEASE_CHANNEL }}
      status: success
      title: novaramedia.com v${{ needs.version.outputs.version }} released
      changelog_version: ${{ needs.version.outputs.version }}
      buttons: |
        View site | https://novaramedia.com/
        Release PR | ${{ github.event.pull_request.html_url }}
        Commit | ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}
    secrets:
      slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
